<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop - Lembrete de Clientes</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a727c;--bd:#e1e4e8;--ac:#128c4a;--ac2:#fff;--red:#c62828;--yel:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1c1f23;--tx:#eceff2;--mut:#98a0a9;--bd:#2e3338;--ac:#2fbf71;--ac2:#08120c;--red:#ef6b6b;--yel:#e8a53c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--card:#1c1f23;--tx:#eceff2;--mut:#98a0a9;--bd:#2e3338;--ac:#2fbf71;--ac2:#08120c;--red:#ef6b6b;--yel:#e8a53c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:17px;margin:22px 0 8px}
p{color:var(--mut);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--ac2);font-size:15px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}
button.full{width:100%;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:500}
.chip.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.cl{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cl b{display:block}.cl small{color:var(--mut)}
.st{font-size:13px;font-weight:600}
.late{color:var(--red)}.today{color:var(--yel)}.ok{color:var(--ac)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:8px 10px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center}
.hide{display:none}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 24px}
.pn{max-width:560px;margin:0 auto;background:var(--bg);border-radius:14px;padding:16px;border:1px solid var(--bd)}
ol{padding-left:20px;margin:8px 0;color:var(--mut);font-size:15px}ol li{margin-bottom:6px}
</style>
</head>

body{background:radial-gradient(900px 420px at 100% -5%,rgba(47,224,111,.20),transparent 60%),radial-gradient(800px 420px at -10% 105%,rgba(47,224,111,.14),transparent 60%),var(--bg);background-attachment:fixed}

.sub{text-align:center;color:var(--mut);margin:-6px 16px 4px;font-size:14px}

<div class="sub">Lembretes de retorno de clientes</div>
<main id="app"></main>
<script>
var KEY="lembrete_clientes_v1",mem=null;
var SUG=["Cabeleireiro","Barbeiro","Manicure","Dentista","Personal Trainer","Esteticista","Mecânico","Veterinário"];
var DEF={"Cabeleireiro":20,"Barbeiro":15,"Manicure":15,"Dentista":180,"Personal Trainer":30,"Esteticista":30,"Mecânico":180,"Veterinário":365};
var S={owner:"",profs:[],clients:[]},tab=null,sel=[];
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{owner:"",profs:[],clients:[]}}
var mtok="";
function tok(){try{return localStorage.getItem("loop_tok")||mtok}catch(e){return mtok}}
function setTok(t){mtok=t;try{if(t)localStorage.setItem("loop_tok",t);else localStorage.removeItem("loop_tok")}catch(e){}}
function api(method,url,body){
  return fetch(url,{method:method,headers:{"Content-Type":"application/json","x-token":tok()},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401){setTok("");showAuth();throw new Error("auth")}
    return r.json()});
}
function showAuth(mode){
  mode=mode||"login";var su=mode==="signup";
  document.getElementById("gear").style.display="none";document.getElementById("cfg").innerHTML="";
  document.getElementById("app").innerHTML='<div class="card"><div class="chips"><button class="chip'+(!su?' on':'')+'" onclick="showAuth(\'login\')">Entrar</button><button class="chip'+(su?' on':'')+'" onclick="showAuth(\'signup\')">Criar conta</button></div><label>E-mail</label><input id="ae" type="email" autocomplete="email"><label>Senha</label><input id="ap" type="password" autocomplete="'+(su?'new-password':'current-password')+'" placeholder="mínimo 6 caracteres">'+(su?'<label>Repita a senha</label><input id="ap2" type="password" autocomplete="new-password">':'')+'<button class="full" onclick="doAuth(\''+mode+'\')">'+(su?'Criar conta':'Entrar')+'</button></div>';
}
function doAuth(mode){
  var e=document.getElementById("ae").value.trim(),p=document.getElementById("ap").value;
  if(!e||!p){alert("Preencha e-mail e senha.");return}
  if(mode==="signup"&&p!==document.getElementById("ap2").value){alert("As senhas não são iguais.");return}
  fetch("/api/"+mode,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p})}).then(function(r){return r.json()}).then(function(r){
    if(r.error){alert(r.error);return}
    setTok(r.token);boot();
  }).catch(function(){alert("Sem conexão com o servidor.")});
}
function logout(){api("POST","/api/logout").catch(function(){}).then(function(){setTok("");S={owner:"",profs:[],clients:[]};tab=null;sel=[];showAuth()})}
function boot(){
  if(!tok()){showAuth();return}
  api("GET","/api/state").then(function(d){document.getElementById("gear").style.display="";S=d;render()}).catch(function(){});
}
function save(){api("PUT","/api/state",S).catch(function(){alert("Não consegui salvar. Verifique a conexão.")})}
function runNow(){api("POST","/api/run").then(function(r){alert(r.error?r.error:"Enviadas: "+r.sent+" | Falhas: "+r.failed)})}
function closeCfg(){document.getElementById("cfg").innerHTML=""}
function openCfg(){
  api("GET","/api/settings").then(function(s){
    var h='<div class="ov" onclick="if(event.target===this)closeCfg()"><div class="pn"><div class="top"><h2 style="margin:0">Configurar WhatsApp</h2><button class="s" onclick="closeCfg()">Fechar</button></div>';
    h+='<p>Status: <b class="'+(s.configured?'ok':'late')+'">'+(s.configured?'conectado ('+esc(s.hint)+')':'ainda não configurado')+'</b></p>';
    h+='<div class="card"><b>Como conseguir a API (Z-API)</b><ol><li>Entre em <b>z-api.io</b> e crie uma conta (há teste grátis).</li><li>No painel, crie uma <b>instância</b> e toque em conectar.</li><li>No celular: WhatsApp, Aparelhos conectados, Conectar aparelho, e leia o <b>QR Code</b>.</li><li>Na instância, copie o <b>link da API</b> do envio de texto (termina em /send-text).</li><li>No painel, em Segurança, copie o <b>Client-Token</b> da conta.</li><li>Cole os dois abaixo e toque em Salvar.</li></ol></div>';
    h+='<label>Link da API (send-text)</label><input id="zu" placeholder="https://api.z-api.io/instances/.../token/.../send-text" autocomplete="off"><label>Client-Token</label><input id="zc" type="password" placeholder="Token de segurança da conta" autocomplete="off"><button class="full" onclick="saveCfg()">Salvar</button><button class="s full" onclick="testCfg()">Enviar mensagem de teste</button></div></div>';
    document.getElementById("cfg").innerHTML=h;
  });
}
function saveCfg(){
  api("PUT","/api/settings",{url:document.getElementById("zu").value.trim(),clientToken:document.getElementById("zc").value.trim()}).then(function(r){
    if(r.error){alert(r.error);return}
    alert("Salvo!");openCfg();
  });
}
function testCfg(){
  var n=prompt("Número que vai receber o teste (com DDD):");if(!n)return;
  api("POST","/api/test",{phone:n}).then(function(r){alert(r.error?"Erro: "+r.error:"Mensagem de teste enviada!")});
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function br(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function dueOf(c){return addDays(c.last,c.days)}
function left(c){return diff(dueOf(c),iso(new Date()))}
function prof(id){return S.profs.filter(function(p){return p.id===id})[0]}
function status(c){var l=left(c);if(l<0)return['<span class="st late">Atrasado '+(-l)+' dia(s)</span>'];if(l===0)return['<span class="st today">Avisar hoje</span>'];return['<span class="st ok">Faltam '+l+' dia(s)</span>']}
function phone(p){var d=String(p).replace(/\D/g,"");if(d.length<=11)d="55"+d;return d}
function wa(id){
  var c=S.clients.filter(function(x){return x.id===id})[0],p=prof(c.profId);
  var m=fill(msgFor(p),c,p);
  window.open("https://wa.me/"+phone(c.phone)+"?text="+encodeURIComponent(m),"_blank");
}
function render(){
  var a=document.getElementById("app");
  if(!S.profs.length){a.innerHTML=setup();return}
  if(!tab||!prof(tab))tab=S.profs[0].id;
  a.innerHTML=main();
}
function setup(){
  var h='<h1>Bem-vindo</h1><p>Cadastre-se para começar. Você pode escolher várias profissões.</p><div class="card"><label>Seu nome ou nome do negócio</label><input id="own" value="'+esc(S.owner)+'" placeholder="Ex: Studio da Ana"><label>Suas profissões</label><div class="chips">';
  SUG.concat(sel.filter(function(s){return SUG.indexOf(s)<0})).forEach(function(n){h+='<button class="chip'+(sel.indexOf(n)>=0?' on':'')+'" onclick="pick(this.dataset.n)" data-n="'+esc(n)+'">'+esc(n)+'</button>'});
  h+='</div><label>Outra profissão</label><div class="row"><input id="oth" placeholder="Digite e toque em adicionar"><button class="s" style="flex:0" onclick="addOther()">Adicionar</button></div><button class="full" onclick="start()">Começar</button></div>';
  return h;
}
function pick(n){var i=sel.indexOf(n);if(i>=0)sel.splice(i,1);else sel.push(n);S.owner=document.getElementById("own").value;render()}
function addOther(){var v=document.getElementById("oth").value.trim();S.owner=document.getElementById("own").value;if(v&&sel.indexOf(v)<0)sel.push(v);render()}
function start(){
  var v=document.getElementById("oth").value.trim();if(v&&sel.indexOf(v)<0)sel.push(v);
  var o=document.getElementById("own").value.trim();
  if(!o||!sel.length){alert("Informe seu nome e escolha pelo menos uma profissão.");return}
  S.owner=o;S.profs=sel.map(function(n){return{id:uid(),name:n,days:DEF[n]||30}});save();render();
}
function main(){
  var t=iso(new Date()),p=prof(tab);
  var due=S.clients.filter(function(c){return left(c)<=0&&prof(c.profId)}).sort(function(a,b){return left(a)-left(b)});
  var h='<div class="top"><h1>'+esc(S.owner)+'</h1><button class="s" onclick="runNow()">Enviar lembretes agora</button><button class="s" onclick="logout()">Sair</button></div>';
  h+='<h2>Avisar agora ('+due.length+')</h2>';
  if(!due.length)h+='<p>Nenhum cliente para avisar hoje.</p>';
  due.forEach(function(c){h+=row(c,true)});
  h+='<h2>Profissão</h2><div class="chips">';
  S.profs.forEach(function(x){h+='<button class="chip'+(x.id===tab?' on':'')+'" onclick="tab=\''+x.id+'\';render()">'+esc(x.name)+'</button>'});
  h+='<button class="chip" onclick="newProf()">+ Nova</button></div>';
  h+='<div class="card"><b>Novo cliente — '+esc(p.name)+'</b><label>Nome do cliente</label><input id="cn"><label>WhatsApp (com DDD)</label><input id="cp" type="tel" placeholder="77 99999-9999"><div class="row"><div><label>Data do atendimento</label><input id="cd" type="date" value="'+t+'"></div><div><label>Voltar em (dias)</label><input id="cy" type="number" min="1" value="'+p.days+'"></div></div><button class="full" onclick="addClient()">Salvar cliente</button></div>';
  h+='<div class="card"><div class="row"><div><label>Padrão de dias para '+esc(p.name)+'</label><input type="number" min="1" value="'+p.days+'" onchange="setDays(this.value)"></div><button class="s" style="flex:0;margin-top:26px" onclick="delProf()">Remover profissão</button></div></div>';
  h+=msgCard(p);
  var list=S.clients.filter(function(c){return c.profId===tab}).sort(function(a,b){return left(a)-left(b)});
  h+='<h2>Clientes de '+esc(p.name)+' ('+list.length+')</h2>';
  if(!list.length)h+='<p>Nenhum cliente cadastrado.</p>';
  list.forEach(function(c){h+=row(c,false)});
  return h;
}

var GEN="Olá, {nome}! 😊 Aqui é da {empresa}. Faz um tempinho que não te vemos por aqui e a verdade é que sentimos a sua falta! Já se passaram {dias} dias desde o seu último atendimento, e agora é a hora ideal para cuidar de você de novo. Passa aqui para a gente te receber com todo o carinho. Posso reservar um horário para você? Estamos te esperando! 💚";
var DEFMSG={
"Cabeleireiro":"Olá, {nome}! 💇 Aqui é da {empresa}. Já faz {dias} dias desde o seu último corte, e o cabelo já deve estar pedindo um trato! Sentimos a sua falta por aqui. Passa aqui para renovar o visual, vai ser um prazer te receber de novo. Quer que eu reserve um horário para você? 😊",
"Barbeiro":"Fala, {nome}! 💈 Aqui é da {empresa}. Já faz {dias} dias desde o seu último corte e a barba e o cabelo já devem estar pedindo capricho. Sentimos a sua falta! Vem dar aquele talento no visual com a gente. Quer que eu reserve seu horário? 👊",
"Manicure":"Olá, {nome}! 💅 Aqui é da {empresa}. Já faz {dias} dias desde o seu último atendimento, é a hora perfeita para renovar as unhas! Sentimos a sua falta por aqui. Vem se cuidar com a gente, vai ser um prazer te receber. Posso reservar um horário? 💖",
"Dentista":"Olá, {nome}! 🦷 Aqui é da {empresa}. Já se passaram {dias} dias desde a sua última consulta, e manter o acompanhamento em dia é o melhor para o seu sorriso. Sentimos a sua falta! Posso reservar um horário para você? 😁",
"Pet shop":"Olá, {nome}! 🐶 Aqui é da {empresa}. Já faz {dias} dias desde a última visita do seu pet, e ele merece um novo dia de carinho e cuidado! Sentimos saudade dos dois por aqui. Quer que eu reserve um horário? 🐾"
};
function msgFor(p){return p.msg||DEFMSG[p.name]||GEN}
function fill(t,c,p){return t.replace(/\{nome\}/g,String(c.name).split(" ")[0]).replace(/\{empresa\}/g,S.owner||"nossa equipe").replace(/\{dias\}/g,c.days).replace(/\{profissao\}/g,p.name)}
function saveMsg(){var p=prof(tab);p.msg=document.getElementById("mg").value.trim();save();alert("Mensagem salva!")}
function resetMsg(){delete prof(tab).msg;save();render()}
function pv(){var p=prof(tab);document.getElementById("pv").textContent=fill(document.getElementById("mg").value,{name:"Maria",days:p.days},p)}
function msgCard(p){return '<div class="card"><b>Mensagem enviada ao cliente ('+esc(p.name)+')</b><p style="margin:4px 0">Use {nome}, {empresa}, {dias} e {profissao}: são trocados automaticamente.</p><textarea id="mg" rows="8" oninput="pv()" style="width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit">'+esc(msgFor(p))+'</textarea><p style="margin:8px 0 2px"><b>Como o cliente vai ver:</b></p><div id="pv" style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:15px">'+esc(fill(msgFor(p),{name:"Maria",days:p.days},p))+'</div><div class="row" style="margin-top:10px"><button onclick="saveMsg()">Salvar mensagem</button><button class="s" onclick="resetMsg()">Restaurar padrão</button></div></div>'}
function row(c,showProf){
  var p=prof(c.profId);
  return '<div class="card"><div class="cl"><div><b>'+esc(c.name)+'</b><small>'+(showProf?esc(p.name)+' · ':'')+esc(c.phone)+'<br>Volta em '+br(dueOf(c))+' (a cada '+c.days+' dias)</small></div>'+status(c)[0]+'</div><div class="acts" style="margin-top:10px"><button onclick="wa(\''+c.id+'\')">Avisar no WhatsApp</button><button class="s" onclick="renew(\''+c.id+'\')">Atendido hoje</button><button class="s" onclick="editDays(\''+c.id+'\')">Mudar dias</button><button class="s" onclick="delClient(\''+c.id+'\')">Excluir</button></div></div>';
}
function addClient(){
  var n=document.getElementById("cn").value.trim(),ph=document.getElementById("cp").value.trim(),d=document.getElementById("cd").value,y=parseInt(document.getElementById("cy").value,10);
  if(!n||ph.replace(/\D/g,"").length<10||!d||!(y>0)){alert("Preencha nome, WhatsApp válido, data e dias.");return}
  S.clients.push({id:uid(),profId:tab,name:n,phone:ph,last:d,days:y});save();render();
}
function renew(id){S.clients.forEach(function(c){if(c.id===id)c.last=iso(new Date())});save();render()}
function editDays(id){var c=S.clients.filter(function(x){return x.id===id})[0],v=parseInt(prompt("Voltar em quantos dias?",c.days),10);if(v>0){c.days=v;save();render()}}
function delClient(id){S.clients=S.clients.filter(function(c){return c.id!==id});save();render()}
function setDays(v){v=parseInt(v,10);if(v>0){prof(tab).days=v;save();render()}}
function newProf(){var n=(prompt("Nome da nova profissão:")||"").trim();if(!n)return;var id=uid();S.profs.push({id:id,name:n,days:DEF[n]||30});tab=id;save();render()}
function delProf(){
  if(S.clients.some(function(c){return c.profId===tab})){alert("Remova primeiro os clientes desta profissão.");return}
  if(S.profs.length<2){alert("Mantenha pelo menos uma profissão.");return}
  S.profs=S.profs.filter(function(p){return p.id!==tab});tab=null;save();render();
}
boot();
</script>
</body>
</html>
